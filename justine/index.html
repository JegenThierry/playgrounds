<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <script src="index.js?v=3" defer></script>
    <link rel="stylesheet" href="reset.css?v=1" />
    <link rel="stylesheet" href="index.css?v=2" />
    <link rel="shortcut icon" href="./assets/favicon.ico" type="image/x-icon" />
    <title>Reasons I Adore Justine</title>
  </head>

  <body>
    <div id="petals" class="petals" aria-hidden="true"></div>

    <main class="stage">
      <!-- Hero / intro -->
      <section class="screen screen--hero is-active" data-screen="hero">
        <p class="hero-eyebrow">reasons i adore</p>
        <h1 class="hero-title">Justine</h1>
        <p class="hero-greeting">Hi Justine 🌹 I picked you a little something.</p>
        <button type="button" class="btn btn--start" data-action="begin">
          Tap to begin
        </button>
      </section>

      <!-- Compliment carousel -->
      <section class="screen screen--cards" data-screen="cards">
        <div class="card" id="card">
          <span class="card-index" id="cardIndex"></span>
          <p class="card-text" id="cardText"></p>
        </div>

        <div class="dots" id="dots" aria-hidden="true"></div>

        <div class="controls">
          <button type="button" class="btn btn--ghost" data-action="prev">
            ← back
          </button>
          <button type="button" class="btn" data-action="next">next →</button>
        </div>
      </section>

      <!-- Finale -->
      <section class="screen screen--finale" data-screen="finale">
        <div class="card card--finale">
          <p class="finale-text">
            And the biggest reason of all: the most beautiful person in
            existence, breathtaking inside and out, somehow has a heart even
            more stunning than that face. You stand above all others, Justine. 💗
          </p>
          <p class="finale-sign">always yours 💞</p>
        </div>
        <button type="button" class="btn btn--start" data-action="replay">
          replay 🌹
        </button>
      </section>
    </main>
  </body>
</html>
