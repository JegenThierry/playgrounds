<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Happy Easter! 🐣</title>
  <link rel="stylesheet" href="index.css">

<body>

  <canvas id="confetti-canvas"></canvas>

          <circle cx="78" cy="44" r="3.5" fill="#fff9c4" opacity="0.9" />

          <circle cx="40" cy="85" r="3.5" fill="#f48fb1" opacity="0.8" />

          <circle cx="42" cy="114" r="5.5" fill="#ef9a9a" />

          <circle cx="158" cy="114" r="5.5" fill="#ffb74d" />
          <path d="M100,10 C58,10,14,58,14,120 C14,182,50,230,100,230 C150,230,186,182,186,120 C186,58,142,10,100,10Z"
            fill="none" stroke="rgba(160,90,120,0.28)" stroke-width="2.5" />
        </svg>
      </div>

      <div class="shell-half shell-bottom">
        <svg class="shell-svg" viewBox="0 0 200 240" xmlns="http://www.w3.org/2000/svg">

            fill="none" stroke="rgba(160,90,120,0.28)" stroke-width="2.5" />
        </svg>
      </div>

      <svg class="crack-svg" viewBox="0 0 200 240" xmlns="http://www.w3.org/2000/svg">
        <path class="crack-path" id="c1" d="M100,85 L97,97 L101,110" />

        <path class="crack-path" id="c9" d="M69,150  L62,166 L67,181" />
        <path class="crack-path" id="c10" d="M69,150  L100,158 L122,165" />
      </svg>

      <div class="chick-wrap">🐣</div>
    </div>

    <div class="progress" id="progress"></div>
    <div class="hint" id="hint">Tap the egg! 🥚</div>
  </div>

  <div id="result">
    <div class="big-chick">🐣</div>
    <div class="easter-text">Happy Easter!</div>
    <div class="easter-sub">Wishing you joy, love &amp; chocolate 🍫</div>
    <button class="replay-btn" onclick="reset()">Crack another egg! 🥚</button>
  </div>

  <script src="index.js"></script>
</body>

</html>
