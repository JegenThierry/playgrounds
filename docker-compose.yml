name: playgrounds

x-nginx-site: &nginx-site
  image: nginx:1.27-alpine
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /var/cache/nginx
    - /var/run
    - /tmp
  security_opt:
    - no-new-privileges:true
  healthcheck:
    test: ["CMD", "wget", "-q", "--spider", "http://localhost/"]
    interval: 30s
    timeout: 5s
    retries: 3
    start_period: 5s

services:
  birthday:
    <<: *nginx-site
    container_name: playgrounds-birthday
    ports:
      - "${BIRTHDAY_PORT:-1231}:80"
    volumes:
      - ./birthday:/usr/share/nginx/html:ro

  easter:
    <<: *nginx-site
    container_name: playgrounds-easter
    ports:
      - "${EASTER_PORT:-1232}:80"
    volumes:
      - ./easter:/usr/share/nginx/html:ro

  flower:
    <<: *nginx-site
    container_name: playgrounds-flower
    ports:
      - "${FLOWER_PORT:-1234}:80"
    volumes:
      - ./flower:/usr/share/nginx/html:ro

  sunflower:
    <<: *nginx-site
    container_name: playgrounds-sunflower
    ports:
      - "${SUNFLOWER_PORT:-1238}:80"
    volumes:
      - ./sunflower:/usr/share/nginx/html:ro

networks:
  default:
    name: nginx-network
    external: true
