<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <title>The Sunflower</title>
  <link rel="stylesheet" href="index.css" />
  <link rel="shortcut icon" href="./assets/favicon.ico" type="image/x-icon" />
</head>

<body
  class="flex flex-col h-screen w-screen justify-center items-center bg-gradient-to-b from-sky-300 via-sky-100 to-amber-100 overflow-hidden relative">
  <div class="sun"></div>

  <div class="field"></div>

  <div class="absolute top-1/6 text-center text-amber-900 z-50 animate-pulse">
    <h1 class="text-xl font-light tracking-widest uppercase opacity-80">
      A little sunshine for
    </h1>
    <h2 class="text-3xl font-bold mt-1">You</h2>
  </div>

  <div class="sunflower-wrapper z-10 mt-24">
    <div class="flower-glow"></div>

    <div class="head">
      <div class="petal-ring back">
        <div class="petal"></div>
        <div class="petal"></div>
        <div class="petal"></div>
        <div class="petal"></div>
        <div class="petal"></div>
        <div class="petal"></div>
        <div class="petal"></div>
        <div class="petal"></div>
        <div class="petal"></div>
        <div class="petal"></div>
        <div class="petal"></div>
        <div class="petal"></div>
      </div>
      <div class="petal-ring front">
        <div class="petal"></div>
        <div class="petal"></div>
        <div class="petal"></div>
        <div class="petal"></div>
        <div class="petal"></div>
        <div class="petal"></div>
        <div class="petal"></div>
        <div class="petal"></div>
        <div class="petal"></div>
        <div class="petal"></div>
        <div class="petal"></div>
        <div class="petal"></div>
      </div>
      <div class="center">
        <div class="seeds"></div>
      </div>
      <div class="bee"></div>
    </div>

    <div class="stem">
      <div class="leaf left"></div>
      <div class="leaf right"></div>
    </div>
  </div>

  <div
    class="absolute z-0 w-full h-full pointer-events-none opacity-30 mix-blend-overlay bg-[url('data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMjAiIGhlaWdodD0iMjAiIHhtbG5zPSJodHRwOi8vd3d3LnczLm9yZy8yMDAwL3N2ZyI+PGNpcmNsZSBjeD0iMiIgY3k9IjIiIHI9IjIiIGZpbGw9IiNmZmYiLz48L3N2Zz4=')]">
  </div>
</body>

</html>
