name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            suffix: amd64
          - platform: linux/arm64
            suffix: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and export tarball
        run: |
          docker buildx build \
            --platform ${{ matrix.platform }} \
            -t playgrounds:${{ github.ref_name }} \
            -t playgrounds:latest \
            --output type=docker,dest=playgrounds-${{ github.ref_name }}-${{ matrix.suffix }}.tar \
            .

      - name: Compress tarball
        run: gzip -9 playgrounds-${{ github.ref_name }}-${{ matrix.suffix }}.tar

      - name: Checksum
        run: sha256sum playgrounds-${{ github.ref_name }}-${{ matrix.suffix }}.tar.gz > SHA256SUMS-${{ matrix.suffix }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: playgrounds-${{ matrix.suffix }}
          path: |
            playgrounds-${{ github.ref_name }}-${{ matrix.suffix }}.tar.gz
            SHA256SUMS-${{ matrix.suffix }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          assets=(assets/*.tar.gz assets/SHA256SUMS-*)
          if [ ${#assets[@]} -eq 0 ]; then
            echo "::error::No release assets were produced by the build job."
            exit 1
          fi
          gh release create "${{ github.ref_name }}" \
            --generate-notes \
            "${assets[@]}"
