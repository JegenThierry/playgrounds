<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <script src="index.js" defer></script>
    <link rel="stylesheet" href="reset.css" />
    <link rel="stylesheet" href="index.css" />
    <link rel="shortcut icon" href="./assets/favicon.ico" type="image/x-icon" />
    <title>For the prettiest girl in the world</title>
</head>

<body>
    <div id="sky" class="floaties" aria-hidden="true"></div>

    <main class="stage">
        <header class="intro">
            <p class="intro-eyebrow">a little love letter for</p>
            <h1 class="intro-title">you</h1>
            <p class="intro-sub">the prettiest girl in the world</p>
        </header>

        <section class="center">
            <div class="envelope-scene">
                <div class="letter" id="letter" aria-hidden="true"></div>

                <button type="button" id="envelope" class="envelope" aria-label="Open the love letter" aria-expanded="false">
                    <span class="envelope-body"></span>
                    <span class="envelope-flap"></span>
                    <span class="wax-seal" aria-hidden="true">♥</span>
                </button>
            </div>

            <p id="hint" class="hint">tap the envelope ✿</p>
        </section>

        <footer class="footer">made with love ✿</footer>
    </main>
</body>

</html>
