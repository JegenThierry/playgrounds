<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="index.js" defer></script>
    <link rel="stylesheet" href="reset.css" />
    <link rel="stylesheet" href="index.css" />
    <link rel="shortcut icon" href="./assets/favicon.ico" type="image/x-icon" />
    <title>For the Prettiest Girl in the World</title>
</head>

<body
    class="min-h-[100dvh] w-screen overflow-hidden relative bg-gradient-to-b from-indigo-950 via-violet-950 to-slate-950 text-slate-100 selection:bg-rose-300/40 font-sans">
    <div class="moon" aria-hidden="true"></div>

    <div id="sky" class="absolute inset-0 z-0 overflow-hidden pointer-events-none" aria-hidden="true"></div>

    <main class="relative z-10 flex flex-col items-center justify-center min-h-[100dvh] px-6 py-12 gap-10">
        <div class="text-center animate-pulse">
            <h1 class="text-sm sm:text-base font-light tracking-[0.3em] uppercase text-rose-200/80">
                A love letter for
            </h1>
            <h2 class="text-3xl sm:text-4xl font-bold mt-1 text-rose-100 drop-shadow-[0_0_12px_rgba(244,114,182,0.4)]">
                You
            </h2>
        </div>

        <div class="envelope-scene">
            <div class="letter" id="letter" aria-hidden="true"></div>

            <button type="button" id="envelope" class="envelope" aria-label="Open the love letter"
                aria-expanded="false">
                <div class="envelope-body"></div>
                <div class="envelope-flap"></div>
                <div class="wax-seal" aria-hidden="true">♥</div>
            </button>
        </div>

        <p id="hint"
            class="text-xs sm:text-sm text-rose-200/60 tracking-wider uppercase transition-opacity duration-500">
            tap the envelope ✨
        </p>
    </main>

    <footer class="absolute bottom-3 inset-x-0 text-center text-xs text-rose-200/50 font-medium z-10">
        Made with love
    </footer>
</body>

</html>
