<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>A Very Important Question</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
        href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="index.css" />
</head>

<body>
    <div class="hearts-bg" id="heartsBg"></div>
    <div class="confetti-layer" id="confettiLayer"></div>

    <main class="card-wrapper">
        <div class="card" id="card">
            <div class="screen" id="screenQuestion">
                <p class="label">A very important question for you...</p>
                <h1 class="headline">
                    Would you like to <br />
                    <em>go on a date</em> <br />
                    with me?
                </h1>
                <div class="doodle-line"></div>
                <div class="buttons">
                    <button class="btn btn-yes" id="btnYes" onclick="handleYes()">
                        Yes!! 🥰
                    </button>
                    <button class="btn btn-no" id="btnNo">Nope 🙅</button>
                </div>
                <p class="hint" id="noHint"></p>
            </div>

            <div class="screen screen-hidden" id="screenSending">
                <div class="spinner">💌</div>
                <p class="sending-text">Sending your answer...</p>
            </div>

            <div class="screen screen-hidden" id="screenSuccess">
                <div class="big-emoji">🎉</div>
                <h2 class="success-title">Yay!! You said yes!</h2>
                <p class="success-sub">
                    I'll be counting down the days.<br />
                    Can't wait to see you!
                </p>
            </div>
        </div>

        <div class="card-shadow"></div>
    </main>

    <script src="index.js"></script>
</body>

</html>
