<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stress Shredder</title>
    <link
        rel="shortcut icon"
        href="./assets/favicon.ico"
        type="image/x-icon"
    />
    <link rel="stylesheet" href="./index.css" />
</head>
<body>

    <canvas id="star-canvas"></canvas>

    <div class="container" id="main-container">
        <h1>Stress Shredder</h1>
        <p class="subtitle">Type it out. Let it go. It vanishes forever.</p>

        <textarea
            id="stress-input"
            placeholder="What's weighing on you right now?"
            autofocus
        ></textarea>

        <br />
        <button class="let-go-btn" id="let-go-btn">Let it go ✦</button>
    </div>

    <p class="privacy">Your words are never stored — they vanish into the void.</p>

    <script src="./index.js"></script>
</body>
</html>
