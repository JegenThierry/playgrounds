server {
  listen 80;
  server_name birthday.thierry.beer;

  root /srv/birthday;
  index index.html;
  client_max_body_size 1m;

  location / {
    try_files $uri $uri/ =404;
  }

  location = /favicon.ico {
    log_not_found off;
  }
}

