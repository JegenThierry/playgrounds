name: playgrounds

services:
  playgrounds:
    image: ghcr.io/jegenthierry/playgrounds:latest
    container_name: playgrounds
    restart: unless-stopped
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - traefik-network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-network"
      - "traefik.http.services.playgrounds.loadbalancer.server.port=80"

      # 1. Birthday Router
      - "traefik.http.routers.playgrounds-birthday.rule=Host(`birthday.thierry.beer`)"
      - "traefik.http.routers.playgrounds-birthday.entrypoints=websecure"
      - "traefik.http.routers.playgrounds-birthday.tls=true"
      - "traefik.http.routers.playgrounds-birthday.tls.certresolver=letsencrypt"
      - "traefik.http.routers.playgrounds-birthday.service=playgrounds"

      # 2. Easter Router
      - "traefik.http.routers.playgrounds-easter.rule=Host(`easter.thierry.beer`)"
      - "traefik.http.routers.playgrounds-easter.entrypoints=websecure"
      - "traefik.http.routers.playgrounds-easter.tls=true"
      - "traefik.http.routers.playgrounds-easter.tls.certresolver=letsencrypt"
      - "traefik.http.routers.playgrounds-easter.service=playgrounds"

      # 3. Flower Router
      - "traefik.http.routers.playgrounds-flower.rule=Host(`flower.thierry.beer`)"
      - "traefik.http.routers.playgrounds-flower.entrypoints=websecure"
      - "traefik.http.routers.playgrounds-flower.tls=true"
      - "traefik.http.routers.playgrounds-flower.tls.certresolver=letsencrypt"
      - "traefik.http.routers.playgrounds-flower.service=playgrounds"

      # 4. Sunflower Router
      - "traefik.http.routers.playgrounds-sunflower.rule=Host(`sunflower.thierry.beer`)"
      - "traefik.http.routers.playgrounds-sunflower.entrypoints=websecure"
      - "traefik.http.routers.playgrounds-sunflower.tls=true"
      - "traefik.http.routers.playgrounds-sunflower.tls.certresolver=letsencrypt"
      - "traefik.http.routers.playgrounds-sunflower.service=playgrounds"

networks:
  traefik-network:
    external: true
